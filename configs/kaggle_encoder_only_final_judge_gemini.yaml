llm_judge:
  input_path: /kaggle/working/reports/eat_bart_encoder_only_final_generations.csv
  output_path: /kaggle/working/reports/eat_bart_encoder_only_final_llm_judge_gemini.csv
  summary_output_path: /kaggle/working/reports/eat_bart_encoder_only_final_llm_judge_gemini_summary.csv
  provider: gemini
  model: gemini-3.6-flash
  api_key_env: GEMINI_API_KEY
  question_column: question
  prediction_column: generated_response
  reference_column: reference_response
  max_examples: 10
  sleep_seconds: 13.0
  temperature: 0.0
  timeout_seconds: 60
  max_retries: 3
  rate_limit_sleep_seconds: 65.0
  continue_on_error: true
