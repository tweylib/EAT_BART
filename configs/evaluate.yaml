inherits: configs/default.yaml

evaluation:
  model_source: checkpoint
  checkpoint_path: models/bart_baseline
  output_path: reports/bart_baseline_generations.csv
  max_eval_examples: 50
  batch_size: 4
  max_new_tokens: 512
  num_beams: 4
  do_sample: false
  repetition_penalty: 1.2
  no_repeat_ngram_size: 3
  length_penalty: 1.0
  early_stopping: true
