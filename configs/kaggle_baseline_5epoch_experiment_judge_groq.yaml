llm_judge:
  input_path: /kaggle/working/reports/bart_baseline_50epoch_experiment_generations.csv
  output_path: /kaggle/working/reports/bart_baseline_50epoch_experiment_llm_judge_groq.csv
  summary_output_path: /kaggle/working/reports/bart_baseline_50epoch_experiment_llm_judge_groq_summary.csv
  provider: groq
  model: llama-3.3-70b-versatile
  api_key_env: GROQ_API_KEY
  question_column: question
  prediction_column: generated_response
  reference_column: reference_response
  max_examples:
  sleep_seconds: 1.0
  temperature: 0.0
  timeout_seconds: 60
  max_retries: 3
  rate_limit_sleep_seconds: 30.0
  continue_on_error: true
  max_output_tokens: 256
  response_format_json: true
