inherits: configs/kaggle_encoder_only.yaml

training:
  output_dir: /kaggle/working/models/eat_bart_encoder_only_final
  num_train_epochs: 8
  learning_rate: 0.00003
  per_device_train_batch_size: 2
  per_device_eval_batch_size: 2
  gradient_accumulation_steps: 8
  fp16: true
  eval_strategy: epoch
  save_strategy: epoch
  save_total_limit: 2
  logging_steps: 50
