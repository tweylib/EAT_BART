llm_judge:
  input_path: /kaggle/working/reports/bart_baseline_comparable_generations.csv
  output_path: /kaggle/working/reports/bart_baseline_comparable_judge_gpt_oss.csv
  summary_output_path: /kaggle/working/reports/bart_baseline_comparable_judge_gpt_oss_summary.csv
  provider: groq
  model: openai/gpt-oss-120b
  api_key_env: GROQ_API_KEY
  question_column: question
  prediction_column: generated_response
  reference_column: reference_response
  max_examples: 100
  sleep_seconds: 2.0
  temperature: 0.0
  timeout_seconds: 60
  max_retries: 3
  rate_limit_sleep_seconds: 30.0
  continue_on_error: true
  max_output_tokens: 512
  response_format_json: false
