inherits: configs/kaggle_decoder_eat.yaml

evaluation:
  model_source: eat_checkpoint
  checkpoint_path: /kaggle/working/models/decoder_eat
  output_path: /kaggle/working/reports/decoder_eat_generations.csv
  max_eval_examples:
  batch_size: 4
  max_new_tokens: 512
  num_beams: 4
  do_sample: false
  repetition_penalty: 1.15
  no_repeat_ngram_size: 3
  length_penalty: 1.15
  early_stopping: true
  emotion_feature_condition: aligned
