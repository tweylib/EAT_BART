inherits: configs/kaggle_encoder_eat_comparable_warmup_ds64_a005_lr1e4.yaml

# Strict placement ablation against the final encoder experiment. RoBERTa uses
# a triangular self-attention mask over decoder-input tokens, so every aligned
# feature is prefix-only and has the same definition during training and free
# generation. BART and GoEmotions remain frozen; only decoder W1/W2 train.
model:
  modify_encoder_self_attention: false
  modify_decoder_self_attention: true
  modify_cross_attention: false

training:
  output_dir: /kaggle/working/models/decoder_eat_comparable_warmup_ds64_a005_lr1e4
  require_eat_weight_update: true
  minimum_relative_eat_update: 0.0

data:
  contextual_emotion_cache:
    enabled: true
    path: /kaggle/working/cache/goemotions_decoder_causal_triangular_fp16_v1.pt
    batch_size: 8

eat_signal:
  output_path: /kaggle/working/reports/decoder_eat_comparable_warmup_ds64_a005_lr1e4_r_h.csv

