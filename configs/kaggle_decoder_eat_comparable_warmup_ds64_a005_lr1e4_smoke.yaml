inherits: configs/kaggle_decoder_eat_comparable_warmup_ds64_a005_lr1e4.yaml

# Five optimizer steps over an isolated subset. Training exits with an error if
# decoder W1/W2 have no finite nonzero aggregate update.
comparison:
  # The 64-example subset intentionally differs from the full baseline manifest.
  require_baseline_manifest: false

training:
  output_dir: /kaggle/working/models/decoder_eat_comparable_warmup_ds64_a005_lr1e4_smoke
  max_steps: 5
  num_train_epochs: 1
  save_model: false
  eval_strategy: "no"
  save_strategy: "no"
  load_best_model_at_end: false
  metric_for_best_model:
  greater_is_better:

data:
  max_examples: 64
  contextual_emotion_cache:
    enabled: true
    path: /kaggle/working/cache/goemotions_decoder_causal_triangular_smoke_fp16_v1.pt
    batch_size: 8

eat_signal:
  enabled: false
